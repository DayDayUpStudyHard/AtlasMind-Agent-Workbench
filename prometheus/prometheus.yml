# ============================================
# Prometheus 配置 — AtlasMind Agent Workbench 监控
# ============================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: AtlasMind Agent Workbench

scrape_configs:
  - job_name: "agent-server"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["agent-server:18080"]
        labels:
          service: "AtlasMind Agent Workbench-api"
