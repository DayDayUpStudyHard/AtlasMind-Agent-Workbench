# Sample eval case: Missing liability cap
caseId: SAMPLE-003
contractType: SERVICE_PROCUREMENT
title: "缺少责任上限条款的技术服务合同"
description: "合同仅约定赔偿直接损失，未设责任上限金额"
contractText: |
  技术咨询服务合同

  甲方：XX制造有限公司
  乙方：AA咨询有限公司

  第一条 服务内容
  乙方为甲方提供智能制造转型咨询服务。

  第二条 合同金额
  本合同总金额为人民币200万元。

  第三条 责任条款
  乙方因履行本合同给甲方造成损失的，应承担赔偿责任。

  第四条 保密
  双方对商业秘密承担保密义务，保密期限为合同终止后3年。

expectedFindings:
  - title: "缺少责任上限条款"
    severity: HIGH
    clauseType: LIABILITY
    mustHaveContractCitation: true
    mustHavePolicyCitation: true
    keyTerms: ["责任上限", "赔偿", "违约金", "间接损失"]

shouldNotFind: []

expectedCitationCount: 2
