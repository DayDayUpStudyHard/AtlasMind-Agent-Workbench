# ============================================
# AtlasMind Agent Workbench Nginx 配置
# 职责：知识门户 + 管理后台 + API 反向代理
# ============================================

upstream agent-server {
    server agent-server:18080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Keep the reverse proxy limit aligned with Spring's 300 MB multipart
    # limit so large PDF/DOCX files reach the application instead of failing
    # at Nginx with a generic 413 response.
    client_max_body_size 300m;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        application/x-font-ttf
        font/opentype;

    # ==================== 静态资源强缓存 ====================
    location ^~ /assets/ {
        alias /usr/share/nginx/html/portal/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        alias /usr/share/nginx/html/portal/favicon.svg;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /admin/favicon.svg {
        alias /usr/share/nginx/html/admin/favicon.svg;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==================== API 反向代理 ====================
    location /api/ {
        proxy_pass http://agent-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ==================== 文件上传代理 ====================
    location /upload/ {
        proxy_pass http://agent-server/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ==================== 管理后台 SPA ====================
    # 注意：管理后台路由 base 需设为 '/admin/'
    # 在 agent-admin/src/router/index.js 中：
    #   const router = createRouter({ history: createWebHistory('/admin/'), ... })
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理后台的静态资源（由 alias 内部处理，不需要额外配置）

    # ==================== 知识门户 SPA ====================
    location / {
        root /usr/share/nginx/html/portal;
        try_files $uri $uri/ /index.html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
