# ============================================
# AtlasMind Agent Workbench CI 流水线
# 触发条件: push/PR 到 master 分支
# ============================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==================== 后端构建 & 测试 ====================
  backend:
    name: "后端: Java ${{ matrix.java-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
    defaults:
      run:
        working-directory: agent-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: 编译 + 测试
        run: ./mvnw test -B

  # ==================== 前端构建 ====================
  frontend:
    name: "前端: ${{ matrix.project }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [agent-front, agent-admin]
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

  ai-service:
    name: "后端: Python AI"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chat-assistant/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/chat-assistant/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest

  # ==================== Docker 镜像构建验证 ====================
  docker:
    name: Docker 镜像验证
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    env:
      MYSQL_ROOT_PASSWORD: ci-mysql-password
      REDIS_PASSWORD: ci-redis-password
      CHAT_ASSISTANT_TOKEN: ci-chat-token
      INTERNAL_SERVICE_TOKEN: ci-internal-token
      CORS_ALLOWED_ORIGINS: https://demo.example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      GRAFANA_PASSWORD: ci-grafana-password
      NGINX_PORT: 8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建 agent-server 镜像
        run: docker build -t agent-server:test ./agent-server

      - name: 构建 nginx 镜像
        run: docker build -t atlasmind-agent-nginx:test -f Dockerfile.nginx .

      - name: 构建 AI 服务镜像
        run: docker build -t atlasmind-agent-ai-service:test ./tools/chat-assistant/backend

      - name: 校验 Compose 配置
        run: docker compose config --quiet

      - name: Compose 启动冒烟测试
        run: |
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8080/

      - name: 输出 Compose 日志
        if: failure()
        run: docker compose logs --no-color

      - name: 清理 Compose 冒烟环境
        if: always()
        run: docker compose down -v --remove-orphans

      - name: 验证镜像存在
        run: |
          docker images | grep agent-server
          docker images | grep atlasmind-agent-nginx
          docker images | grep atlasmind-agent-ai-service
